<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荣光冲锋 配兵器 — Glorious Charge Army Builder</title>
  <!-- 附加版本号破除旧版静态缓存 -->
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>

  <!-- 顶部控制与数据总览栏 -->
  <header class="top-nav">
    <div class="nav-left">
      <span class="app-brand">荣光冲锋 配兵器</span>

      <!-- 自定义带派系旗帜下拉选择器 -->
      <div class="custom-select" id="faction-custom-select">
        <div class="select-trigger" id="select-trigger">
          <img id="current-flag-img" src="assets/flags/default.png" alt="Flag" onerror="this.style.display='none'">
          <span id="current-faction-name">加载派系中...</span>
          <span class="arrow">▼</span>
        </div>
        <div class="select-options" id="select-options">
          <!-- 动态渲染各派系旗帜与名称 -->
        </div>
      </div>
    </div>

    <!-- 顶部中央仪表盘 -->
    <div class="nav-center dashboard-summary">
      <div class="dash-item">花费: <b id="stat-cost">0</b> / <input type="number" id="input-cost-limit" value="14000" step="500"></div>
      <div class="dash-item">总数: <b id="stat-total">0 / 30</b></div>
      <div class="dash-item">重骑+炮: <b id="stat-heavy-art">0 / 7</b></div>
      <div class="dash-item">火炮: <b id="stat-artillery">0 / 3</b></div>
      <div class="dash-item">战将: <b id="stat-mob">0 / 3</b></div>
    </div>

    <!-- 导入导出与配置操作 -->
    <div class="nav-right">
      <button class="btn btn-dark" id="btn-export">📋 导出配置</button>
      <button class="btn btn-dark" id="btn-import">📥 导入配置</button>
      <button class="btn btn-dark" id="btn-clear-army">清空全军</button>
    </div>
  </header>

  <!-- 中间核心工作区 -->
  <div class="main-body">
    
    <!-- 左侧过滤器与配额状态侧边栏 -->
    <aside class="sidebar-filters">
      <div class="filter-group">
        <label class="filter-title">搜索单位</label>
        <input type="text" id="search-input" placeholder="输入名称或代码...">
      </div>

      <div class="filter-group">
        <label class="filter-title">大类 (CATEGORY)</label>
        <div class="btn-grid" id="cat-filters">
          <button class="filter-btn active" data-cat="all">全部</button>
          <button class="filter-btn" data-cat="general">将领</button>
          <button class="filter-btn" data-cat="infantry">步兵</button>
          <button class="filter-btn" data-cat="cavalry">骑兵</button>
          <button class="filter-btn" data-cat="artillery">炮兵</button>
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-title">兵种联动配额</label>
        <div class="quota-list">
          <div class="quota-row">线列步兵: <span id="q-line" class="val">0</span></div>
          <div class="quota-row">散兵配额: <span id="q-skirmisher" class="val">0 / 0</span></div>
          <div class="quota-row">掷弹兵配额: <span id="q-grenadier" class="val">0 / 0</span></div>
          <div class="quota-row">精锐步兵配额: <span id="q-elite" class="val">0 / 0</span></div>
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-title">招募预算限制 (COST)</label>
        <div class="cost-slider-wrap">
          <input type="range" id="cost-range" min="0" max="2500" value="2500" step="50">
          <span id="cost-range-val">≤ 2500</span>
        </div>
      </div>
    </aside>

    <!-- 中部：按兵种分栏展开的可选单位池 -->
    <main class="roster-view" id="roster-view">
      <!-- 动态按 STAFF / 骑兵 / 火炮 / 掷弹与精锐 / 轻步与散兵 / 线列 分类横排渲染 -->
    </main>
  </div>

  <!-- 底部 30 格军队编制卡槽栏 (层叠重叠无滚动条，左键直接撤销) -->
  <footer class="bottom-army-bar">
    <div class="army-tray-label">军队编制 (MAX 30) — 点击卡槽直接撤销单位</div>
    <div class="army-slots-container" id="army-slots-container">
      <!-- 动态生成 30 个军队椭圆卡槽 -->
    </div>
  </footer>

  <!-- 悬停属性即时弹窗 (Tooltip) -->
  <div class="unit-tooltip" id="unit-tooltip" style="display:none;"></div>

  <!-- 非阻塞悬浮提示气泡 (Toast) -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 逻辑脚本 -->
  <script src="app.js?v=6.0"></script>
</body>
</html>
